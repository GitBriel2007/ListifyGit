<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/Estudo.css" />
    <title>Listify</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <figure class="fotoPerfil">
        <img id="ImgFabricante" src="Images/Fabricante.jpg" />
      </figure>

      <div class="menuDropdown" id="menuDropdown">
        <input type="checkbox" id="menuToggle" />
        <i id="menuToggle" class="bi bi-caret-right-fill"></i>

        <nav class="menu">
          <a class="linksMenu" href="#">Adicionar Produto</a>
          <a class="linksMenu" href="#">Editar perfil</a>
          <a class="linksMenu" href="#">Ver Perfil</a>
          <a class="linksMenu" href="#">Sair</a>
        </nav>
      </div>

      <figure class="fotoLogo">
        <img id="imgPrincipalListify" src="Images/imgPrincipalListify.png" />
      </figure>
    </header>

    <main>
      <section></section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
