<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/Main.css" />
    <title>Listify</title>
  </head>
  <body>
    <header elemento Pai>
      <figure elemento Filho e pai class="imgPerfil">
        <img id="ImgFabricante" src="Images/Fabricante.jpg" />
      </figure>

      <div elemento Filho e pai class="menuDropdown" id="menuDropdown">
        <input elemento filho type="checkbox" id="menuToggle" />
        <label elemento filho for="menuToggle" class="toggleButton"></label>

        <nav elemento Filho e pai class="menu">
          <ul elemento Filho>
            <li><a href="#">Adicionar Produto</a></li>
            <li><a href="#">Editar perfil</a></li>
            <li><a href="#">Ver Perfil</a></li>
            <li><a href="#">Sair</a></li>
          </ul>
        </nav>
      </div>

      <figure elemento Filho e pai class="imgLogo">
        <img
          elemento
          filho
          id="imgPrincipalListify"
          src="Images/imgPrincipalListify.png"
        />
      </figure>
    </header>

    <main>
      <section></section>
    </main>
  </body>
</html>
